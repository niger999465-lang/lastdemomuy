name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Missing Project Files & Assets
        run: |
          # 1. Tạo các tệp ngôn ngữ Localizable.strings còn thiếu
          mkdir -p ThreeOneOSFive/en.lproj
          mkdir -p ThreeOneOSFive/zh-Hans.lproj
          mkdir -p ThreeOneOSFive/vi.lproj
          touch ThreeOneOSFive/en.lproj/Localizable.strings
          touch ThreeOneOSFive/zh-Hans.lproj/Localizable.strings
          touch ThreeOneOSFive/vi.lproj/Localizable.strings

          # 2. Tạo thư mục Assets.xcassets và AppIcon trống để tránh lỗi actool
          mkdir -p ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset
          cat << 'EOF' > ThreeOneOSFive/Assets.xcassets/Contents.json
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          cat << 'EOF' > ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          # 3. Tạo tệp Info.plist cơ bản nếu chưa có
          if [ ! -f "ThreeOneOSFive/Info.plist" ]; then
            cat << 'EOF' > ThreeOneOSFive/Info.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleIdentifier</key>
                <string>com.mobile.ThreeOneOSFive</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>UILaunchScreen</key>
                <dict/>
            </dict>
            </plist>
            EOF
          fi

      - name: Build App for Generic iOS Device
        run: |
          # Tự động lấy tên scheme hiện có trong project
          SCHEME_NAME=$(xcodebuild -list -json | python3 -c "import sys, json; data = json.load(sys.stdin); print(data['project']['schemes'][0])")
          echo "=> Đang build với Scheme: $SCHEME_NAME"

          # Thực hiện biên dịch
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          # Đóng gói thành tệp .ipa
          mkdir -p build/Payload
          APP_NAME=$(ls build/DerivedData/Build/Products/Release-iphoneos/ | grep "\.app$" | head -n 1)
          echo "=> Đã tìm thấy App product: $APP_NAME"
          
          cp -r build/DerivedData/Build/Products/Release-iphoneos/"$APP_NAME" build/Payload/
          cd build
          zip -r ThreeOneOSFive.ipa Payload
          
          mkdir -p ../output
          mv ThreeOneOSFive.ipa ../output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: output/ThreeOneOSFive.ipa
