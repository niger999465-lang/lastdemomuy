name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Missing Project Files & Assets
        run: |
          # 1. Tạo các tệp ngôn ngữ Localizable.strings còn thiếu
          mkdir -p ThreeOneOSFive/en.lproj ThreeOneOSFive/zh-Hans.lproj ThreeOneOSFive/vi.lproj
          touch ThreeOneOSFive/en.lproj/Localizable.strings ThreeOneOSFive/zh-Hans.lproj/Localizable.strings ThreeOneOSFive/vi.lproj/Localizable.strings

          # 2. Tạo thư mục Assets.xcassets và AppIcon trống bằng lệnh echo
          mkdir -p ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset
          echo '{"info":{"author":"xcode","version":1}}' > ThreeOneOSFive/Assets.xcassets/Contents.json
          echo '{"images":[],"info":{"author":"xcode","version":1}}' > ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json

          # 3. Tạo tệp Info.plist cơ bản nếu chưa có
          if [ ! -f "ThreeOneOSFive/Info.plist" ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>CFBundleIdentifier</key>\n\t<string>com.mobile.ThreeOneOSFive</string>\n\t<key>CFBundleShortVersionString</key>\n\t<string>1.0</string>\n\t<key>CFBundleVersion</key>\n\t<string>1</string>\n\t<key>UILaunchScreen</key>\n\t<dict/>\n</dict>\n</plist>\n' > ThreeOneOSFive/Info.plist
          fi

      - name: Build App for Generic iOS Device
        run: |
          # Tự động lấy tên scheme hiện có trong project
          SCHEME_NAME=$(xcodebuild -list -json | python3 -c "import sys, json; data = json.load(sys.stdin); print(data['project']['schemes'][0])")
          echo "=> Đang build với Scheme: $SCHEME_NAME"

          # Thực hiện biên dịch
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          # Đóng gói thành tệp .ipa
          mkdir -p build/Payload
          APP_NAME=$(ls build/DerivedData/Build/Products/Release-iphoneos/ | grep "\.app$" | head -n 1)
          echo "=> Đã tìm thấy App product: $APP_NAME"
          
          cp -r build/DerivedData/Build/Products/Release-iphoneos/"$APP_NAME" build/Payload/
          cd build
          zip -r ThreeOneOSFive.ipa Payload
          
          mkdir -p ../output
          mv ThreeOneOSFive.ipa ../output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: output/ThreeOneOSFive.ipa
